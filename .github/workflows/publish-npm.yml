name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # requerido para Trusted Publishing (OIDC), sin token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar
        run: npm run build
      - name: Publicar en npm
        run: npm publish --provenance
